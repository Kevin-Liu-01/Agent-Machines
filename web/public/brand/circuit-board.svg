<svg xmlns="http://www.w3.org/2000/svg" width="384" height="512" viewBox="0 0 384 512" fill="none" shape-rendering="crispEdges">
  <title>Agent Machines geometric circuit grid</title>
  <defs>
    <style>
      .grid{stroke:#fff;stroke-width:1;opacity:.08;vector-effect:non-scaling-stroke}
      .rail{stroke:#fff;stroke-width:2;opacity:.42;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
      .trace{stroke:#fff;stroke-width:1;opacity:.5;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
      .fine{stroke:#fff;stroke-width:1;opacity:.24;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
      .node{fill:none;stroke:#fff;stroke-width:1.5;opacity:.68;vector-effect:non-scaling-stroke}
      .pad{fill:#fff;opacity:.72}
    </style>
  </defs>

  <!-- A strict 32px construction grid. Every trace below follows it. -->
  <g class="grid">
    <path d="M0 32H384M0 96H384M0 160H384M0 224H384M0 288H384M0 352H384M0 416H384M0 480H384"/>
    <path d="M32 0V512M96 0V512M160 0V512M224 0V512M288 0V512M352 0V512"/>
  </g>

  <!-- Shared vertical data spine and repeat-safe edge rails. -->
  <g>
    <path class="rail" d="M192 0V512"/>
    <path class="fine" d="M0 16H128V32H160M224 32H256V16H384"/>
    <path class="fine" d="M0 496H128V480H160M224 480H256V496H384"/>
  </g>

  <!-- Repeated compute cells: input module → processor → output module. -->
  <g>
    <!-- Row A -->
    <rect class="node" x="32" y="48" width="64" height="64"/>
    <rect class="node" x="160" y="48" width="64" height="64"/>
    <rect class="node" x="288" y="48" width="64" height="64"/>
    <rect class="fine" x="176" y="64" width="32" height="32"/>
    <path class="trace" d="M0 64H32M96 64H128V80H160M224 80H256V64H288M352 64H384"/>
    <path class="trace" d="M0 96H32M96 96H128V112H176V128H192M192 112H224M224 96H256V96H288M352 96H384"/>
    <path class="fine" d="M48 48V32M64 48V32M80 48V32M304 48V32M320 48V32M336 48V32"/>

    <!-- Row B -->
    <rect class="node" x="32" y="208" width="64" height="64"/>
    <rect class="node" x="160" y="208" width="64" height="64"/>
    <rect class="node" x="288" y="208" width="64" height="64"/>
    <rect class="fine" x="176" y="224" width="32" height="32"/>
    <path class="trace" d="M0 224H32M96 224H128V240H160M224 240H256V224H288M352 224H384"/>
    <path class="trace" d="M0 256H32M96 256H128V272H176V288H192M192 272H224M224 256H256V256H288M352 256H384"/>
    <path class="fine" d="M48 208V192M64 208V192M80 208V192M304 208V192M320 208V192M336 208V192"/>

    <!-- Row C -->
    <rect class="node" x="32" y="368" width="64" height="64"/>
    <rect class="node" x="160" y="368" width="64" height="64"/>
    <rect class="node" x="288" y="368" width="64" height="64"/>
    <rect class="fine" x="176" y="384" width="32" height="32"/>
    <path class="trace" d="M0 384H32M96 384H128V400H160M224 400H256V384H288M352 384H384"/>
    <path class="trace" d="M0 416H32M96 416H128V432H176V448H192M192 432H224M224 416H256V416H288M352 416H384"/>
    <path class="fine" d="M48 368V352M64 368V352M80 368V352M304 368V352M320 368V352M336 368V352"/>
  </g>

  <!-- Uniform pin fields and square junction pads. -->
  <g class="fine">
    <path d="M48 112V128M64 112V128M80 112V128M176 112V128M208 112V128M304 112V128M320 112V128M336 112V128"/>
    <path d="M48 272V288M64 272V288M80 272V288M176 272V288M208 272V288M304 272V288M320 272V288M336 272V288"/>
    <path d="M48 432V448M64 432V448M80 432V448M176 432V448M208 432V448M304 432V448M320 432V448M336 432V448"/>
  </g>
  <g class="pad">
    <rect x="124" y="76" width="8" height="8"/><rect x="252" y="76" width="8" height="8"/>
    <rect x="188" y="124" width="8" height="8"/>
    <rect x="124" y="236" width="8" height="8"/><rect x="252" y="236" width="8" height="8"/>
    <rect x="188" y="284" width="8" height="8"/>
    <rect x="124" y="396" width="8" height="8"/><rect x="252" y="396" width="8" height="8"/>
    <rect x="188" y="444" width="8" height="8"/>
  </g>
</svg>
