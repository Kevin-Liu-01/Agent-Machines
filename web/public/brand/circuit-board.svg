<svg xmlns="http://www.w3.org/2000/svg" width="384" height="512" viewBox="0 0 384 512" fill="none" shape-rendering="geometricPrecision">
  <title>Agent Machines diagonal circuit grid</title>
  <defs>
    <style>
      .grid{stroke:#fff;stroke-width:1;opacity:.055;vector-effect:non-scaling-stroke}
      .rail{stroke:#fff;stroke-width:1.5;opacity:.34;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
      .trace{stroke:#fff;stroke-width:1;opacity:.46;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
      .fine{stroke:#fff;stroke-width:1;opacity:.2;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
      .node{fill:none;stroke:#fff;stroke-width:1.25;opacity:.62;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
      .pad{fill:#fff;opacity:.68}
    </style>

    <g id="compute-row">
      <path class="node" d="M40 48H88L96 56V104L88 112H40L32 104V56Z"/>
      <path class="node" d="M168 48H216L224 56V104L216 112H168L160 104V56Z"/>
      <path class="node" d="M296 48H344L352 56V104L344 112H296L288 104V56Z"/>
      <path class="fine" d="M176 64H208L216 72V96H184L176 88Z"/>

      <path class="trace" d="M0 64H32M96 64H112L128 80H160M224 80H240L256 64H288M352 64H384"/>
      <path class="trace" d="M0 96H32M96 96H128L160 128H176L192 144M192 144L208 128H224L256 96H288M352 96H384"/>
      <path class="fine" d="M48 48L32 32M64 48L48 32M80 48L64 32M304 48L320 32M320 48L336 32M336 48L352 32"/>
      <path class="fine" d="M48 112L32 128M64 112L48 128M80 112L64 128M304 112L320 128M320 112L336 128M336 112L352 128"/>

      <rect class="pad" x="124" y="76" width="8" height="8" transform="rotate(45 128 80)"/>
      <rect class="pad" x="252" y="76" width="8" height="8" transform="rotate(45 256 80)"/>
      <rect class="pad" x="188" y="140" width="8" height="8" transform="rotate(45 192 144)"/>
    </g>
  </defs>

  <!-- A repeat-safe 32px diagonal lattice. -->
  <g class="grid">
    <path d="M-256 0L256 512M-192 0L320 512M-128 0L384 512M-64 0L384 448M0 0L384 384M64 0L384 320M128 0L384 256"/>
    <path d="M640 0L128 512M576 0L64 512M512 0L0 512M448 0L0 448M384 0L0 384M320 0L0 320M256 0L0 256"/>
  </g>

  <!-- Long rails share the same 45-degree axes as every branch. -->
  <g>
    <path class="rail" d="M0 16L112 128H272L384 16"/>
    <path class="rail" d="M0 496L112 384H272L384 496"/>
    <path class="fine" d="M0 176H112L144 208H240L272 176H384"/>
    <path class="fine" d="M0 336H112L144 304H240L272 336H384"/>
  </g>

  <!-- Three compute rows reuse one aligned construction. -->
  <use href="#compute-row"/>
  <use href="#compute-row" transform="translate(0 160)"/>
  <use href="#compute-row" transform="translate(0 320)"/>
</svg>
